<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snippets dialog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&amp;family=Roboto+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.d{--sf:#2A2F2C;--c1:#343A36;--c2:#3E4541;--line:#47504A;--on:#E4EBE6;--onv:#BFC9C2;--p:#6FDBB4;--onp:#00281C;--tn:#2F4A3E;--ontn:#CFE9DB;font-family:Roboto,system-ui,sans-serif;color:var(--on)}
.mono{font-family:"Roboto Mono",monospace}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
@keyframes ins{0%{background:rgba(111,219,180,.4)}100%{background:transparent}}
.tile{width:56px;height:56px;border-radius:16px;background:#1F4A5C;color:#C2E8FD;display:grid;place-items:center;flex:none}
.x{width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:var(--on);display:grid;place-items:center;cursor:pointer}
.row{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:0 14px;border:0;border-radius:16px;background:transparent;color:var(--on);text-align:left;font:inherit;cursor:pointer;transition:background .2s}
.row:hover{background:var(--c2)}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font:500 13px Roboto;color:var(--onv)}
.in{min-height:44px;padding:0 14px;border:0;border-radius:12px;background:var(--c2);color:var(--on);font:400 15px Roboto;box-sizing:border-box}
.fill{min-height:32px;padding:0 10px;border:0;border-radius:8px;background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--on);font:500 12px "Roboto Mono";cursor:pointer;transition:all .3s cubic-bezier(.3,1.4,.5,1)}
.fill:hover{background:var(--tn);box-shadow:none;transform:translateY(-2px)}
.bt{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 22px;border:0;border-radius:999px;font:500 15px Roboto;cursor:pointer;transition:border-radius .35s cubic-bezier(.3,1.4,.5,1)}
.bt:hover{border-radius:16px}
.tn{background:var(--tn);color:var(--ontn)}.pr{background:var(--p);color:var(--onp)}
.abar{display:flex;align-items:center;gap:10px;margin:0 -28px -28px;padding:16px 28px;border-top:1px solid var(--line);border-radius:0 0 32px 32px;background:#252A27}
.kk{font:500 10.5px "Roboto Mono";padding:2px 6px;border-radius:6px;background:rgba(0,0,0,.25)}
@media (prefers-reduced-motion:reduce){.d *{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="d" style="width:980px;height:820px;background:#0E1311;padding:30px;box-sizing:border-box">
<div role="dialog" aria-labelledby="sn-t" style="height:100%;box-sizing:border-box;border-radius:32px;background:var(--sf);padding:28px;display:flex;flex-direction:column;gap:20px;animation:pop .4s cubic-bezier(.3,1.3,.5,1)">
<div style="display:flex;align-items:center;gap:18px">
<span class="tile"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 4H6a2 2 0 0 0-2 2v4l-2 2 2 2v4a2 2 0 0 0 2 2h2M16 4h2a2 2 0 0 1 2 2v4l2 2-2 2v4a2 2 0 0 1-2 2h-2"></path></svg></span>
<span style="flex:1"><span id="sn-t" style="display:block;font:500 24px Roboto">Snippets</span><span style="font:400 15px Roboto;color:var(--onv)">Type a trigger in any app and it becomes the text. 4 snippets</span></span>
<button class="x" aria-label="Close (Esc)" style="width:auto;padding:0 12px;border-radius:999px;gap:8px;display:flex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg><span class="mono" style="font-size:11px;padding:2px 6px;border-radius:6px;background:rgba(0,0,0,.25)">Esc</span></button>
</div>
<div style="display:grid;grid-template-columns:300px 1fr;gap:20px;flex:1;min-height:0">
<div style="border-radius:24px;background:var(--c1);padding:10px;display:flex;flex-direction:column;gap:4px">
<div style="display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;color:var(--onv);font:400 14px Roboto"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4"></path></svg><span style="flex:1">Search snippets</span><span class="mono" style="font-size:12px">Aa .*</span></div>
<sc-for list="{{list}}" as="s" hint-placeholder-count="4"><button class="row" aria-pressed="{{s.on}}" onClick="{{s.pick}}" style="background:{{s.bg}}"><span style="display:flex;flex-direction:column;flex:1;min-width:0"><span style="font:500 15px Roboto">{{s.name}}</span><span class="mono" style="font-size:12px;color:var(--onv)">{{s.trig}}</span></span><span class="mono" style="font-size:11px;color:var(--onv)">{{s.key}}</span></button></sc-for>

</div>
<div style="display:flex;flex-direction:column;gap:14px;min-width:0">
<div style="display:grid;grid-template-columns:1fr 160px 170px;gap:12px">
<div class="fld"><label for="sn-n">Name</label><input id="sn-n" class="in" value="{{name}}"></div>
<div class="fld"><label for="sn-g">Trigger</label><input id="sn-g" class="in mono" value="{{trig}}"></div>
<div class="fld"><label for="sn-k">Hotkey (optional)</label><input id="sn-k" class="in mono" value="{{key}}" placeholder="Press keys"></div>
</div>
<div class="fld"><label for="sn-b">Text</label>
<textarea id="sn-b" class="in mono" style="min-height:130px;padding:12px 14px;resize:none;font-size:14px;line-height:1.6;animation:{{insAnim}}" value="{{body}}" onInput="{{onBody}}"></textarea></div>
<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><span style="font:500 13px Roboto;color:var(--onv);margin-right:4px">Insert</span><sc-for list="{{fills}}" as="f" hint-placeholder-count="6"><button class="fill" onClick="{{f.add}}" title="{{f.tip}}">{{f.t}}</button></sc-for></div>
<div style="border-radius:20px;background:var(--c1);padding:16px 18px;display:flex;flex-direction:column;gap:6px">
<span class="mono" style="font-size:11px;color:var(--onv);letter-spacing:.08em">PREVIEW · WHAT GETS TYPED</span>
<span style="font:400 15px/1.6 Roboto;white-space:pre-wrap">{{preview}}</span>
</div>
<p style="margin:0;font:400 13px/1.5 Roboto;color:var(--onv)">Triggers start with ; so normal typing never fires one. Typing is only matched against your triggers; nothing you type is kept.</p>
</div>
</div>
<div class="abar"><button class="bt tn" aria-haspopup="menu" title="Duplicate, delete, export, import">More <span class="kk">4</span> ▾</button><span style="flex:1;font:400 13px Roboto;color:var(--onv)">Saved as you type.</span><button class="bt tn">Try it here <span class="kk">Ctrl+T</span></button><button class="bt pr">+ New snippet <span class="kk">Ctrl+N</span></button></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":980,"height":820}}'>
class Component extends DCLogic {
  constructor(p){
    super(p);
    this.state = { sel: 0, bodies: ['Thanks,\nSam\n{date}', 'Hi {ask:Name},\n\nThanks for getting in touch. {cursor}', 'Meeting notes {date} {time}\n\n- ', '{clipboard}\n\nSource: {clipboard:domain}'], flash: 0 };
  }
  renderVals() {
    const st = this.state;
    const S = [['Signature', ';sig', 'Ctrl+Alt+S'], ['Reply', ';hi', ''], ['Meeting notes', ';mtg', 'Ctrl+Alt+M'], ['Quote with source', ';src', '']];
    const body = st.bodies[st.sel];
    const vars = { '{date}': 'Fri 6 Nov 2026', '{time}': '16:05', '{clipboard}': 'https://example.com/report', '{clipboard:domain}': 'example.com', '{ask:Name}': 'Alex', '{cursor}': '|' };
    let preview = body; Object.keys(vars).forEach(k => { preview = preview.split(k).join(vars[k]); });
    const F = [['{date}', "Today's date"], ['{time}', 'The time now'], ['{clipboard}', 'What you copied'], ['{ask:Name}', 'Asks you for a value'], ['{cursor}', 'Where the cursor ends up'], ['{clipboard:domain}', 'Just the domain of a copied link']];
    return {
      list: S.map((s, i) => ({ name: s[0], trig: s[1], key: s[2], on: String(i === st.sel), bg: i === st.sel ? 'var(--tn)' : 'transparent', pick: () => this.setState({ sel: i }) })),
      name: S[st.sel][0], trig: S[st.sel][1], key: S[st.sel][2], body, preview,
      insAnim: st.flash ? 'ins .6s' : 'none',
      onBody: (e) => { const b = st.bodies.slice(); b[st.sel] = e.target.value; this.setState({ bodies: b, flash: 0 }); },
      fills: F.map(f => ({ t: f[0], tip: f[1], add: () => { const b = st.bodies.slice(); b[st.sel] = b[st.sel] + f[0]; this.setState({ bodies: b, flash: st.flash + 1 }); } }))
    };
  }
}
</script>
</body>
</html>
