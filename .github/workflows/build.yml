name: Build and release

# Every push to main: fetch pinned dependencies, build through build-installer.bat with every
# dependency bundled, render screenshots of the real app and commit them back to the repository,
# publish the next normal release (v1.0.0, v1.0.1, ...) and deploy the project site.
# Commits made here use GITHUB_TOKEN, which does not start another run, so nothing loops.
# Pull requests only build and render screenshots.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      # First step of the job: the fallback start time for the release-notes timing section.
      - name: Record workflow start
        shell: pwsh
        run: |
          "WORKFLOW_STARTED=$((Get-Date).ToUniversalTime().ToString('o'))" >> $env:GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Work out the next version
        id: ver
        shell: pwsh
        run: |
          git fetch --tags --force
          $tags = git tag --list 'v*' | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
                  ForEach-Object { [version]($_.TrimStart('v')) } | Sort-Object -Descending
          if ($tags) { $l = $tags[0]; $next = "{0}.{1}.{2}" -f $l.Major, $l.Minor, ($l.Build + 1) } else { $next = "1.0.0" }
          "version=$next" >> $env:GITHUB_OUTPUT
          # Release order (number of earlier release tags): picks the dim sum code name.
          "ordinal=$(@($tags).Count)" >> $env:GITHUB_OUTPUT
          Write-Host "Next version: $next (release order $(@($tags).Count))"

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: .deps/cache
          key: deps-${{ hashFiles('deps/manifest.json') }}

      - name: Check the clipboard detectors and extensions
        shell: pwsh
        run: dotnet run --project tests/SmartTests -c Release

      - name: Build installer (build-installer.bat)
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SILENT: "1"
        run: call build-installer.bat ${{ steps.ver.outputs.version }}

      - name: Check the bundle landed in the exe
        shell: pwsh
        run: |
          $exe = Get-Item out/MonitoringTools.exe
          Write-Host ("MonitoringTools.exe is {0:N1} MB" -f ($exe.Length / 1MB))
          Get-ChildItem .deps/ffmpeg | Format-Table Name, Length

      - name: Render screenshots
        id: shots
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process -FilePath out/MonitoringTools.exe -ArgumentList '--screenshots', "$PWD/screenshots" -PassThru
          # The run renders well over 150 windows; allow ten minutes.
          if (-not $p.WaitForExit(600000)) { $p.Kill(); throw "Screenshot run timed out" }
          Get-ChildItem screenshots | Format-Table Name, Length
          if (Test-Path screenshots/error.txt) { Get-Content screenshots/error.txt; throw "Screenshot run failed" }
          if (-not (Test-Path screenshots/index.json)) { throw "No screenshots were written" }
          Compress-Archive -Path screenshots/* -DestinationPath dist/MonitoringTools-screenshots.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MonitoringTools-win-x64
          path: |
            dist/MonitoringTools-Setup.exe
            dist/MonitoringTools-win-x64.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: warn

      # Every look, every language mode, a desktop window, a 1080p screen at 200 percent and 150 percent text: each page,
      # toast, menu, dialog and setup step is opened and its real layout walked. Cut-off or overlapping text, content too
      # wide for a box that cannot scroll, windows bigger than the screen, unnamed controls, missing focus rings and a
      # keyboard walk onto hidden controls fail the build. Trimmed text is listed for review in sweep.md.
      - name: Sweep every surface
        id: sweep
        shell: pwsh
        run: |
          $env:MT_ONLY = 'sweep'
          $p = Start-Process -FilePath out/MonitoringTools.exe -ArgumentList '--screenshots', "$PWD/sweep" -PassThru
          if (-not $p.WaitForExit(1500000)) { $p.Kill(); throw "The sweep timed out" }
          if (Test-Path sweep/error.txt) { Get-Content sweep/error.txt; throw "The sweep could not run" }
          if (-not (Test-Path sweep/sweep.json)) { throw "The sweep wrote no results" }
          $r = Get-Content sweep/sweep.json -Raw | ConvertFrom-Json
          Get-Content sweep/sweep.md | Select-Object -First 200
          Write-Host "Scans: $($r.scans). Findings that fail the sweep: $($r.gating)."
          if ($r.gating -gt 0) { throw "The every-surface sweep found $($r.gating) problems; see sweep.md in the sweep artifact." }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweep
          path: sweep
          if-no-files-found: warn

      - name: Commit refreshed screenshots
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          if (-not (Test-Path screenshots/index.json)) { Write-Host "No screenshots to commit"; exit 0 }
          New-Item -ItemType Directory -Force docs/screenshots | Out-Null
          Remove-Item docs/screenshots/* -Force -ErrorAction SilentlyContinue
          Copy-Item screenshots/* docs/screenshots/
          git config user.name "Claude Fable 5.1"
          git config user.email "noreply@anthropic.com"
          git add docs/screenshots
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "Screenshots unchanged"; exit 0 }
          $lines = @(
            "Refresh screenshots for v${{ steps.ver.outputs.version }}",
            "",
            "Fresh pictures of the real app, rendered by the build machine, which never",
            "blinks and never says cheese.",
            "重新影過啲截圖：部機唔使擺甫士，次次都影得咁靚仔。",
            "",
            "Co-Authored-By: Claude Fable 5.1 <noreply@anthropic.com>"
          )
          $lines -join "`n" | Set-Content -Encoding utf8NoBOM commit-message.txt
          git commit -q -F commit-message.txt
          Remove-Item commit-message.txt
          git pull --rebase --autostash -q origin main
          # The remote sometimes answers a push with a transient server error; retry with backoff.
          $pushed = $false
          foreach ($wait in 0, 2, 4, 8, 16) {
            if ($wait) { Start-Sleep -Seconds $wait; git pull --rebase --autostash -q origin main }
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { $pushed = $true; break }
          }
          if (-not $pushed) { throw "Push to main failed after retries" }

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the desktop build tool and site companion
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # The companion carries this run's fresh screenshots, so new articles can show windows rendered in this run.
          SITE_SCREENSHOTS: ${{ github.workspace }}/screenshots
        run: |
          foreach ($app in 'build-tool', 'site-companion') {
            Push-Location apps/$app
            npm ci --no-audit --no-fund
            npm pkg set version=${{ steps.ver.outputs.version }}
            npm run dist
            if ($LASTEXITCODE -ne 0) { throw "$app failed to build" }
            Get-ChildItem dist/*.exe | ForEach-Object { Write-Host ("{0} {1:N1} MB" -f $_.Name, ($_.Length / 1MB)); Copy-Item $_.FullName ../../dist/ }
            Pop-Location
          }

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-tools
          path: |
            dist/MonitoringTools-BuildTool.exe
            dist/MonitoringTools-Site.exe

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          $assets = @('dist/MonitoringTools-Setup.exe', 'dist/MonitoringTools-win-x64.zip', 'out/MonitoringTools.exe', 'dist/MonitoringTools-BuildTool.exe', 'dist/MonitoringTools-Site.exe')
          if (Test-Path dist/MonitoringTools-screenshots.zip) { $assets += 'dist/MonitoringTools-screenshots.zip' }
          $size = "{0:N0} MB" -f ((Get-Item dist/MonitoringTools-Setup.exe).Length / 1MB)
          $notes = "Setup and portable exe are $size each: FFmpeg, FFprobe and portable Git are bundled inside, so conversion and pushing work offline with nothing else to install. MonitoringTools-BuildTool.exe is a portable desktop front end for build.bat and build-installer.bat; MonitoringTools-Site.exe is the project site and documentation as a portable offline app."

          # ---- notes inputs: changes since the previous release, line counts, timing ----
          $prev = git tag --list 'v*' --sort=-v:refname | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' -and $_ -ne $tag } | Select-Object -First 1
          $range = if ($prev) { "$prev..${{ github.sha }}" } else { "${{ github.sha }}" }
          $changes = (git log --no-merges --format='- %s (%h)' $range) -join "`n"
          $intro = "$notes`n`n## Changes since $(if ($prev) { $prev } else { 'the start' })`n`n$changes"
          $tmp = $env:RUNNER_TEMP
          Set-Content -Encoding utf8NoBOM "$tmp/intro.md" $intro

          node scripts/line-counts.mjs --ref ${{ github.sha }} --json-out "$tmp/counts.json" > "$tmp/counts.md"
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::Line counter reported an inconsistency; the notes say so" }

          # Start of the build job from the API, falling back to the first step's own clock.
          $started = $env:WORKFLOW_STARTED
          try {
            $api = gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" --jq '.jobs[] | select(.name == "windows") | .started_at'
            if ($LASTEXITCODE -eq 0 -and $api) { $started = $api.Trim() }
          } catch { }

          $shots = '${{ steps.shots.outcome }}'
          $checks = "By project policy this workflow runs no tests, lint or other gating checks, so this release is not described as tested. What it did do: ran build-installer.bat (the build), rendered the app's screenshots (outcome: $shots), built the desktop tools, and verified below that this is a normal release with every asset attached."

          function New-Notes($ended) {
            node scripts/release-notes.mjs --version ${{ steps.ver.outputs.version }} --ordinal ${{ steps.ver.outputs.ordinal }} `
              --started $started --ended $ended --counts "$tmp/counts.json" --counts-md "$tmp/counts.md" `
              --intro "$tmp/intro.md" --checks $checks --out "$tmp/notes.md"
            if ($LASTEXITCODE -ne 0) { throw "release-notes.mjs failed" }
          }

          New-Notes ((Get-Date).ToUniversalTime().ToString('o'))
          gh release create $tag @assets --target "${{ github.sha }}" --title "Monitoring Tools $tag" --notes-file "$tmp/notes.md"
          # Read the release back: it must be a normal release with every asset attached.
          $r = gh release view $tag --json isDraft,isPrerelease,tagName,assets | ConvertFrom-Json
          if ($r.isDraft -or $r.isPrerelease) { throw "Release $tag is a draft or prerelease" }
          foreach ($a in $assets) { if (-not ($r.assets.name -contains (Split-Path $a -Leaf))) { throw "Release $tag is missing $a" } }
          Write-Host "Release $tag verified: normal release with $($r.assets.Count) assets"

          # Final timing now that publication and verification are done.
          New-Notes ((Get-Date).ToUniversalTime().ToString('o'))
          # GitHub answers the odd 5xx; the release is already verified, so retry the notes edit rather than fail.
          $edited = $false
          foreach ($wait in 0, 2, 4, 8, 16) {
            Start-Sleep -Seconds $wait
            gh release edit $tag --notes-file "$tmp/notes.md"
            if ($LASTEXITCODE -eq 0) { $edited = $true; break }
          }
          if (-not $edited) { throw "Could not update the notes of $tag after five tries" }
          $global:LASTEXITCODE = 0
          "RELEASE_TMP=$tmp" >> $env:GITHUB_ENV

      - name: Record release figures and changelog in the repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          # Commits made with GITHUB_TOKEN do not start another run, so this cannot loop.
          git config user.name "Claude Fable 5.1"
          git config user.email "noreply@anthropic.com"
          git fetch --tags --force -q
          git pull --rebase --autostash -q origin main
          # Refresh the README figures block in place, from the counts this run produced.
          $t = $env:RELEASE_TMP
          $now = (Get-Date).ToUniversalTime().ToString('o')
          node scripts/release-notes.mjs --version ${{ steps.ver.outputs.version }} --ordinal ${{ steps.ver.outputs.ordinal }} `
            --started $now --ended $now --counts "$t/counts.json" --counts-md "$t/counts.md" `
            --intro "$t/intro.md" --out "$t/unused-notes.md" --readme README.md
          if ($LASTEXITCODE -ne 0) { throw "README figures update failed" }
          node scripts/changelog.mjs
          git add README.md CHANGELOG.md
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "Figures and changelog unchanged"; exit 0 }
          $lines = @(
            "Record v${{ steps.ver.outputs.version }} figures and changelog",
            "",
            "The release workflow counted lines at the released commit and refreshed the README",
            "figures block and the generated changelog from that run.",
            "",
            "Co-Authored-By: Claude Fable 5.1 <noreply@anthropic.com>"
          )
          $lines -join "`n" | Set-Content -Encoding utf8NoBOM commit-message.txt
          git commit -q -F commit-message.txt
          Remove-Item commit-message.txt
          # The remote sometimes answers a push with a transient server error; retry with backoff.
          $pushed = $false
          foreach ($wait in 0, 2, 4, 8, 16) {
            if ($wait) { Start-Sleep -Seconds $wait; git pull --rebase --autostash -q origin main }
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { $pushed = $true; break }
          }
          if (-not $pushed) { throw "Push to main failed after retries" }

  pages:
    needs: windows
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # A manual run on main redeploys the site alone; it never cuts a release.
    # Pages must be switched on once in the repository settings (Source: GitHub Actions).
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: screenshots
          path: site-screenshots

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Renders docs/features/**/*.md into pages, vendored fonts and the real screenshots into site/dist.
      # The fresh screenshots from this run are used when present; otherwise the committed docs/screenshots.
      - name: Build the site
        run: |
          node scripts/vendor-site-fonts.mjs --check
          node scripts/build-site.mjs
        env:
          SITE_SCREENSHOTS: ${{ github.workspace }}/site-screenshots

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - id: deploy
        uses: actions/deploy-pages@v4
